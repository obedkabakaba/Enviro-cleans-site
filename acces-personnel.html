<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Accès personnel - Enviro Cleans</title>
<link rel="icon" type="image/png" href="assets/brand/favicon.png"/>
<style>
  * { box-sizing: border-box; }
  body{
    font-family:'Open Sans', Arial, sans-serif;
    background:#0f1b2d;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    padding:20px;
  }
  .box{
    background:#fff;
    border-radius:16px;
    padding:40px 32px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  h2{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:20px;
    margin:0 0 8px;
    color:#0f1b2d;
  }
  p{ color:#777; font-size:13px; margin-bottom:24px; line-height:1.5; }
  input{
    width:100%;
    padding:13px 14px;
    border:1.5px solid #ddd;
    border-radius:8px;
    font-size:16px;
    text-align:center;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  input:focus{ outline:none; border-color:#3ab54a; }
  button{
    width:100%;
    padding:13px;
    background:#3ab54a;
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Montserrat', sans-serif;
  }
  button:hover{ background:#2d9a3c; }
  .error{ color:#e53935; font-size:12.5px; margin-top:12px; display:none; }
  .cta{
    display:block;
    width:100%;
    padding:13px;
    background:#3ab54a;
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Montserrat', sans-serif;
    text-decoration:none;
    box-sizing:border-box;
  }
  .cta:hover{ background:#2d9a3c; }
  .note{ font-size:12px; color:#999; margin:18px 0 0; }
</style>
  <script src="assets/js/theme-init.js"></script>
  <script src="assets/js/enviro-api.js"></script>
  <link rel="stylesheet" href="assets/css/site-refresh.css"/>
</head>
<body>
  <div class="box">
    <h2>Accès personnel</h2>
    <p>
      Cette section est réservée aux employés Enviro Cleans.
      Connectez-vous avec vos identifiants : votre espace s'ouvrira automatiquement
      selon votre rôle.
    </p>
    <a class="cta" href="espace-client.html">Se connecter</a>
    <p class="note">
      Vous n'avez pas encore d'identifiants&nbsp;? Contactez votre responsable
      hiérarchique ou les ressources humaines.
    </p>
  </div>

<script>
  // ════════════════════════════════════════
  // Cette page ne protège plus rien — et c'est volontaire.
  // ════════════════════════════════════════
  //
  // Elle comparait auparavant une saisie au littéral 'MAJOR', écrit en clair dans le
  // JavaScript de la page, puis se contentait d'AFFICHER une liste de liens. Les pages
  // cibles (gestionnaire.html, superviseur.html…) restaient accessibles par URL directe :
  // la « garde » n'écartait personne, elle donnait seulement l'illusion d'une protection
  // et diffusait un code d'accès à quiconque ouvrait la source (audit §S1).
  //
  // Le vrai contrôle vit désormais à deux endroits :
  //   1. le backend, qui refuse toute requête sans permission (authorizePermission) ;
  //   2. EnviroAuth.proteger(), qui revalide le rôle auprès de /api/auth/me à chaque
  //      chargement d'une page protégée.
  //
  // Cette page n'est plus qu'un point d'entrée. Un employé déjà connecté est envoyé
  // directement vers son espace.
  (function () {
    if (!window.EnviroAPI || !EnviroAPI.Session.accessToken()) return;

    EnviroAPI.get('/api/auth/me')
      .then(function (data) {
        if (data.espace && data.espace.page) location.replace(data.espace.page);
      })
      .catch(function () { /* session invalide : on laisse l'utilisateur se reconnecter */ });
  }());
</script>
  <script src="assets/js/theme.js" defer></script>
</body>
</html>
